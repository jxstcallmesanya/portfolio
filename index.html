<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen" class="active">
        <div class="split-section" data-category="auto">
            <div class="bg-layer" id="auto-bg"></div>
            <div class="overlay"></div>
            <div class="label"><h2>Auto</h2></div>
        </div>
        
        <div class="split-section" data-category="people">
            <div class="bg-layer" id="people-bg"></div>
            <div class="overlay"></div>
            <div class="label"><h2>People</h2></div>
        </div>
    </div>

    <div id="gallery-screen">
        <button id="back-button">Close</button>
        <div class="mosaic-grid" id="gallery-container"></div>
    </div>

    <div id="viewer">
        <span class="close">&times;</span>
        <img id="full-img">
        <div class="arrow prev">&#10094;</div>
        <div class="arrow next">&#10095;</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
