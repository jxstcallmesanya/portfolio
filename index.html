<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <a href="#auto" class="section">
            <div class="bg-grid" id="auto-grid"></div>
            <div class="glass-overlay"></div>
            <div class="content"><h2>Auto</h2></div>
        </a>

        <a href="#people" class="section">
            <div class="bg-grid" id="people-grid"></div>
            <div class="glass-overlay"></div>
            <div class="content"><h2>People</h2></div>
        </a>
    </div>

    <script>
        // --- НАСТРОЙКИ ---
        const userName = 'jxstcallmesanya'; // Твой логин на GitHub
        const repoName = 'portfolio';      // Название репозитория
        // -----------------

        async function loadPhotos(folder, gridId) {
            const grid = document.getElementById(gridId);
            const url = `https://api.github.com/repos/${userName}/${repoName}/contents/img/${folder}`;

            try {
                const response = await fetch(url);
                const files = await response.json();

                if (!Array.isArray(files)) return;

                files.forEach((file, index) => {
                    // Проверяем, что это картинка
                    if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const img = document.createElement('img');
                        // Используем сырую ссылку на фото с GitHub
                        img.src = `https://raw.githubusercontent.com/${userName}/${repoName}/main/${file.path}`;
                        
                        // Рандомная сетка для стиля
                        if (index % 3 === 0) img.className = 'wide';
                        else if (index % 4 === 0) img.className = 'tall';
                        
                        grid.appendChild(img);
                    }
                });
            } catch (error) {
                console.error('Ошибка загрузки списка файлов:', error);
            }
        }

        // Запускаем магию
        loadPhotos('auto', 'auto-grid');
        loadPhotos('people', 'people-grid');
    </script>
</body>
</html>
