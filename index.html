<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen" class="active">
        
        <div class="section left" data-category="auto">
            <div class="bg-grid" id="auto-bg"></div> <div class="glass-overlay"></div>      <div class="content">
                <h2>Auto</h2>
            </div>
        </div>

        <div class="section right" data-category="people">
            <div class="bg-grid" id="people-bg"></div> <div class="glass-overlay"></div>       <div class="content">
                <h2>People</h2>
            </div>
        </div>
    </div>

    <div id="gallery-screen">
        <button id="back-button">← Назад</button>
        <div class="mosaic-gallery" id="gallery-container"></div>
    </div>

    <div id="photo-viewer">
        <span class="close-viewer">&times;</span>
        <img class="viewer-content" id="full-photo">
        <div class="nav-button prev">&#10094;</div>
        <div class="nav-button next">&#10095;</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
