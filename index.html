<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JXSTCALLMESANYA | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="brand"><a href="#" onclick="showSection('main')">JXSTCALLMESANYA</a></div>
        <nav>
            <ul>
                <li><a href="#" onclick="showSection('about')">ОБО МНЕ</a></li>
                <li><a href="#" onclick="showSection('projects')">ПРОЕКТЫ</a></li>
                <li><a href="#" onclick="showSection('contact')">СВЯЗЬ</a></li>
            </ul>
        </nav>
    </header>

    <section id="main-section" class="content-section active">
        <div class="split-container">
            <div onclick="showAuto()" class="split-side">
                <div class="bg-bw" style="background-image: url('img/auto_b.webp');"></div>
                <div class="bg-color" style="background-image: url('img/auto_a.webp');"></div>
                <div class="split-title"><h2>АВТО</h2></div>
            </div>
            <div onclick="showPeople()" class="split-side">
                <div class="bg-bw" style="background-image: url('img/people_b.webp');"></div>
                <div class="bg-color" style="background-image: url('img/people_a.webp');"></div>
                <div class="split-title"><h2>ЛЮДИ</h2></div>
            </div>
        </div>
    </section>

    <section id="auto-section" class="content-section full-page">
        <div class="container">
            <span class="label">АРХИВ</span><h2>АВТОМОБИЛИ</h2>
            <div class="masonry-wrapper" id="auto-grid"></div>
        </div>
    </section>

    <section id="people-section" class="content-section full-page">
        <div class="container">
            <span class="label">АРХИВ</span><h2>ЛЮДИ</h2>
            <div class="masonry-wrapper" id="people-grid"></div>
        </div>
    </section>

    <section id="projects-section" class="content-section full-page">
        <div class="container">
            <span class="label">СЪЕМКИ</span>
            <div class="projects-list" id="projects-list"></div>
        </div>
    </section>

    <section id="single-project-section" class="content-section full-page">
        <div class="container">
            <a href="#" onclick="showSection('projects')" class="back-link">← НАЗАД К ПРОЕКТАМ</a>
            <h2 id="project-title" class="project-main-title"></h2>
            <div class="masonry-wrapper" id="project-photos"></div>
        </div>
    </section>

    <section id="about-section" class="content-section full-page">
        <div class="container about-flex">
            <div class="about-image">
                <img src="img/me.webp" alt="Me">
            </div>
            <div class="about-info">
                <span class="label">ОБО МНЕ</span>
                <h2>Эстетика в деталях.</h2>
                <p class="specs">Sony a7 III / Tamron 28-75 G2</p>
                <div class="line"></div>
                <p class="bio">Автомобильный и репортажный фотограф. Создаю визуальную историю вашего стиля.</p>
            </div>
        </div>
    </section>

    <section id="contact-section" class="content-section full-page">
        <div class="container center">
            <div class="links-stack">
                <a href="https://t.me/designer212" target="_blank">TELEGRAM</a>
                <a href="https://vk.com/veilside777" target="_blank">VKONTAKTE</a>
                <a href="mailto:veilside7774@gmail.com">EMAIL</a>
            </div>
        </div>
    </section>

    <div id="lightbox" onclick="this.style.display='none'"><img id="lb-img"></div>

    <script src="script.js"></script>
</body>
</html>
