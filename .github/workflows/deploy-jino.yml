name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files via FTPS (primary)
        id: deploy_ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JINO_FTP_HOST }}
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /domains/jxstcallmesanya.site/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/.vscode/**
            **/README*.md
            **/package-lock.json
            **/package.json
            **/vercel.json
            **/lib/**
            **/scripts/**
            **/api/config.php

      - name: Upload files via FTPS legacy (fallback)
        id: deploy_ftps_legacy
        if: steps.deploy_ftps.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JINO_FTP_HOST }}
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps-legacy
          port: 21
          server-dir: /domains/jxstcallmesanya.site/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/.vscode/**
            **/README*.md
            **/package-lock.json
            **/package.json
            **/vercel.json
            **/lib/**
            **/scripts/**
            **/api/config.php

      - name: Fail if all deploy methods failed
        if: steps.deploy_ftps.outcome == 'failure' && steps.deploy_ftps_legacy.outcome == 'failure'
        run: |
          echo "FTPS and FTPS legacy both failed. Check Jino host/user/password and protocol support."
          exit 1
