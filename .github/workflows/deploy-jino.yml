name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload files via lftp FTPS with retries
        env:
          JINO_FTP_HOST: ${{ secrets.JINO_FTP_HOST }}
          JINO_FTP_USER: ${{ secrets.JINO_FTP_USER }}
          JINO_FTP_PASSWORD: ${{ secrets.JINO_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ATTEMPTS_PER_MODE=2
          RETRY_DELAY=8

          run_mirror() {
            local mode="$1"
            local port="$2"

            if [ "$mode" = "ftp" ]; then
              local scheme="ftp"
              local ssl_force="false"
              local ssl_protect="false"
            else
              local scheme="ftps"
              local ssl_force="true"
              local ssl_protect="true"
            fi

            lftp -e "
              set cmd:fail-exit true;
              set net:max-retries 1;
              set net:timeout 25;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              set ftp:passive-mode true;
              set ftp:ssl-force ${ssl_force};
              set ftp:ssl-protect-data ${ssl_protect};
              set ssl:verify-certificate false;
              open -u ${JINO_FTP_USER},${JINO_FTP_PASSWORD} ${scheme}://${JINO_FTP_HOST}:${port};
              mirror -R --parallel=2 --only-newer \
                --exclude-glob .git* \
                --exclude-glob .github/* \
                --exclude-glob node_modules/* \
                --exclude-glob .cursor/* \
                --exclude-glob .vscode/* \
                --exclude-glob README*.md \
                --exclude-glob package-lock.json \
                --exclude-glob package.json \
                --exclude-glob vercel.json \
                --exclude-glob lib/* \
                --exclude-glob scripts/* \
                --exclude-glob api/config.php \
                --exclude-glob gallery.json \
                --exclude-glob img/auto/* \
                --exclude-glob img/people/* \
                --exclude-glob img/thumbs/* \
                --exclude-glob img/videos/* \
                . /domains/jxstcallmesanya.site/;
              bye
            "
          }

          MODES=("ftps:21" "ftps:990" "ftp:21")

          for target in "${MODES[@]}"; do
            mode="${target%%:*}"
            port="${target##*:}"
            echo "Trying deploy mode: ${mode} on port ${port}"

            for attempt in $(seq 1 "$ATTEMPTS_PER_MODE"); do
              echo "Attempt ${attempt}/${ATTEMPTS_PER_MODE} for ${mode}:${port}"
              if run_mirror "$mode" "$port"; then
                echo "Deploy succeeded via ${mode}:${port}"
                exit 0
              fi

              if [ "$attempt" -lt "$ATTEMPTS_PER_MODE" ]; then
                echo "Retrying ${mode}:${port} in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              fi
            done
          done

          echo "All deploy modes failed (FTPS:21, FTPS:990, FTP:21)."
          exit 1
