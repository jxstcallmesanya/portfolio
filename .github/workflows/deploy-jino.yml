name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files via FTPS (primary)
        id: deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JINO_FTP_HOST }}
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /domains/jxstcallmesanya.site/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/.vscode/**
            **/README*.md
            **/package-lock.json
            **/package.json
            **/vercel.json
            **/lib/**
            **/scripts/**
            **/api/config.php
            **/gallery.json
            **/img/auto/**
            **/img/people/**
            **/img/thumbs/**
            **/img/videos/**

      - name: Upload files via FTPS (retry 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JINO_FTP_HOST }}
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /domains/jxstcallmesanya.site/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/.vscode/**
            **/README*.md
            **/package-lock.json
            **/package.json
            **/vercel.json
            **/lib/**
            **/scripts/**
            **/api/config.php
            **/gallery.json
            **/img/auto/**
            **/img/people/**
            **/img/thumbs/**
            **/img/videos/**

      - name: Upload files via FTPS (retry 3)
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JINO_FTP_HOST }}
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /domains/jxstcallmesanya.site/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/.vscode/**
            **/README*.md
            **/package-lock.json
            **/package.json
            **/vercel.json
            **/lib/**
            **/scripts/**
            **/api/config.php
            **/gallery.json
            **/img/auto/**
            **/img/people/**
            **/img/thumbs/**
            **/img/videos/**

      - name: Fail if all deploy attempts failed
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        run: |
          echo "FTPS deploy timed out on all 3 attempts."
          exit 1
