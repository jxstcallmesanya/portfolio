name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Один деплой: новый пуш отменяет предыдущий (GitHub concurrency).
concurrency:
  group: jino-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      # Когда раннер уже выдан этому run, сразу гасим другие in_progress/queued того же workflow на main —
      # иначе зависший lftp держит очередь, а новый run вечно Pending.
      - name: Cancel other Deploy to Jino runs on main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentId = context.runId;
            const branch = (context.ref || '').replace('refs/heads/', '');
            if (branch !== 'main') return;
            for (const status of ['queued', 'in_progress']) {
              const res = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy-jino.yml',
                status,
                per_page: 30,
              });
              for (const run of res.data.workflow_runs) {
                if (run.id === currentId) continue;
                if (run.head_branch !== 'main') continue;
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                core.info(`Cancelled run ${run.id} (${status})`);
              }
            }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload files via lftp FTPS with retries
        env:
          JINO_FTP_HOST: ${{ secrets.JINO_FTP_HOST }}
          JINO_FTP_USER: ${{ secrets.JINO_FTP_USER }}
          JINO_FTP_PASSWORD: ${{ secrets.JINO_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ATTEMPTS_PER_PROFILE=1
          RETRY_DELAY=8
          # Сначала обычный FTP (часто стабильнее из GitHub к shared-хостингу), затем FTPS.
          MODES=("ftp:21" "ftps:21" "ftps:990")
          PASSIVE_PROFILES=("true" "false")

          run_mirror() {
            local mode="$1"
            local port="$2"
            local passive="$3"

            if [ "$mode" = "ftp" ]; then
              scheme="ftp"
              ssl_force="false"
              ssl_protect="false"
            else
              scheme="ftps"
              ssl_force="true"
              ssl_protect="true"
            fi

            # Жёсткий лимит на один вызов lftp, чтобы run не висел часами при мёртвом FTP.
            if timeout 300 lftp -u "$JINO_FTP_USER","$JINO_FTP_PASSWORD" "${scheme}://${JINO_FTP_HOST}:${port}" -e "
              set cmd:fail-exit true;
              set net:max-retries 1;
              set net:timeout 25;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              set ftp:passive-mode ${passive};
              set ftp:prefer-epsv false;
              set ftp:ssl-force ${ssl_force};
              set ftp:ssl-protect-data ${ssl_protect};
              set ssl:verify-certificate false;
              mirror -R --parallel=1 --only-newer \
                --exclude-glob .git* \
                --exclude-glob .github/* \
                --exclude-glob node_modules/* \
                --exclude-glob .cursor/* \
                --exclude-glob .vscode/* \
                --exclude-glob README*.md \
                --exclude-glob package-lock.json \
                --exclude-glob package.json \
                --exclude-glob vercel.json \
                --exclude-glob lib/* \
                --exclude-glob scripts/* \
                --exclude-glob api/config.php \
                --exclude-glob gallery.json \
                --exclude-glob img/auto/* \
                --exclude-glob img/people/* \
                --exclude-glob img/thumbs/* \
                --exclude-glob img/videos/* \
                --exclude-glob '*.zip' \
                . /domains/jxstcallmesanya.site/;
              bye
            "; then
              return 0
            else
              echo "lftp failed or hit 300s timeout for ${mode}:${port} passive=${passive}"
              return 1
            fi
          }

          for target in "${MODES[@]}"; do
            mode="${target%%:*}"
            port="${target##*:}"
            echo "Trying deploy mode: ${mode} on port ${port}..."

            for passive in "${PASSIVE_PROFILES[@]}"; do
              echo "Connection profile: passive=${passive}"
              for attempt in $(seq 1 "$ATTEMPTS_PER_PROFILE"); do
                echo "Attempt ${attempt}/${ATTEMPTS_PER_PROFILE} for ${mode}:${port}, passive=${passive}"
                if run_mirror "$mode" "$port" "$passive"; then
                  echo "Deploy succeeded via ${mode}:${port}, passive=${passive}"
                  exit 0
                fi

                if [ "$attempt" -lt "$ATTEMPTS_PER_PROFILE" ]; then
                  echo "Retrying in ${RETRY_DELAY}s..."
                  sleep "$RETRY_DELAY"
                fi
              done
            done
          done

          echo "All deploy modes/profiles failed (FTP:21, FTPS:21, FTPS:990; passive true/false)."
          exit 1
