name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload files via lftp FTPS with retries
        env:
          JINO_FTP_HOST: ${{ secrets.JINO_FTP_HOST }}
          JINO_FTP_USER: ${{ secrets.JINO_FTP_USER }}
          JINO_FTP_PASSWORD: ${{ secrets.JINO_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ATTEMPTS=3
          DELAY=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "FTPS deploy attempt ${attempt}/${ATTEMPTS}"
            if lftp -e "
              set net:max-retries 1;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 20;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate false;
              open -u ${JINO_FTP_USER},${JINO_FTP_PASSWORD} ftps://${JINO_FTP_HOST}:21;
              mirror -R --parallel=2 --only-newer \
                --exclude-glob .git* \
                --exclude-glob .github/* \
                --exclude-glob node_modules/* \
                --exclude-glob .cursor/* \
                --exclude-glob .vscode/* \
                --exclude-glob README*.md \
                --exclude-glob package-lock.json \
                --exclude-glob package.json \
                --exclude-glob vercel.json \
                --exclude-glob lib/* \
                --exclude-glob scripts/* \
                --exclude-glob api/config.php \
                --exclude-glob gallery.json \
                --exclude-glob img/auto/* \
                --exclude-glob img/people/* \
                --exclude-glob img/thumbs/* \
                --exclude-glob img/videos/* \
                . /domains/jxstcallmesanya.site/;
              bye
            "; then
              echo "Deploy success on attempt ${attempt}"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "Attempt ${attempt} failed, retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
          done

          echo "All FTPS deploy attempts failed."
          exit 1
