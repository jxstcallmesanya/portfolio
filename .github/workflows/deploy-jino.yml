name: Deploy to Jino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Один деплой: новый пуш отменяет предыдущий (GitHub concurrency).
concurrency:
  group: jino-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Когда раннер уже выдан этому run, сразу гасим другие in_progress/queued того же workflow на main —
      # иначе зависший деплой держит очередь, а новый run вечно Pending.
      - name: Cancel other Deploy to Jino runs on main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentId = context.runId;
            const branch = (context.ref || '').replace('refs/heads/', '');
            if (branch !== 'main') return;
            for (const status of ['queued', 'in_progress']) {
              const res = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy-jino.yml',
                status,
                per_page: 30,
              });
              for (const run of res.data.workflow_runs) {
                if (run.id === currentId) continue;
                if (run.head_branch !== 'main') continue;
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                core.info(`Cancelled run ${run.id} (${status})`);
              }
            }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # rclone использует другой FTP-стек, чем lftp; на части хостингов проходит там, где lftp ловит max-retries.
      # Важно: rclone copy (не sync), чтобы не удалять на сервере файлы вне репозитория (gallery.json, img/...).
      - name: Upload to Jino via rclone (FTP / FTPS profiles)
        env:
          JINO_FTP_HOST: ${{ secrets.JINO_FTP_HOST }}
          JINO_FTP_USER: ${{ secrets.JINO_FTP_USER }}
          JINO_FTP_PASSWORD: ${{ secrets.JINO_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          RC=/tmp/rclone-jino.conf
          REMOTE_PATH="/domains/jxstcallmesanya.site"
          OBF=$(rclone obscure "$JINO_FTP_PASSWORD")

          EX=(
            "--exclude=.git/**"
            "--exclude=.github/**"
            "--exclude=node_modules/**"
            "--exclude=.cursor/**"
            "--exclude=.vscode/**"
            "--exclude=README*.md"
            "--exclude=package-lock.json"
            "--exclude=package.json"
            "--exclude=vercel.json"
            "--exclude=lib/**"
            "--exclude=scripts/**"
            "--exclude=api/config.php"
            "--exclude=gallery.json"
            "--exclude=img/auto/**"
            "--exclude=img/people/**"
            "--exclude=img/thumbs/**"
            "--exclude=img/videos/**"
            "--exclude=*.zip"
          )

          try_profile() {
            echo "---- rclone profile: $* ----"
            rm -f "$RC"
            rclone config create jino ftp \
              host "$JINO_FTP_HOST" \
              user "$JINO_FTP_USER" \
              pass "$OBF" \
              "$@" \
              --config "$RC" --non-interactive

            rclone copy . "jino:${REMOTE_PATH}" \
              --config "$RC" \
              "${EX[@]}" \
              --transfers 6 \
              --checkers 8 \
              --retries 5 \
              --low-level-retries 3 \
              --contimeout 90s \
              --timeout 180s \
              --stats 45s
          }

          set +e
          try_profile port 21 tls false explicit_tls false disable_epsv true
          ok=$?
          if [ "$ok" -eq 0 ]; then echo "OK: plain FTP :21 (EPSV off)"; exit 0; fi

          try_profile port 21 tls false explicit_tls true disable_epsv true no_check_certificate true
          ok=$?
          if [ "$ok" -eq 0 ]; then echo "OK: explicit FTPS :21"; exit 0; fi

          try_profile port 990 tls true explicit_tls false disable_epsv true no_check_certificate true
          ok=$?
          if [ "$ok" -eq 0 ]; then echo "OK: implicit FTPS :990"; exit 0; fi

          try_profile port 21 tls false explicit_tls false disable_epsv false
          ok=$?
          if [ "$ok" -eq 0 ]; then echo "OK: plain FTP :21 (EPSV on)"; exit 0; fi

          set -e
          echo "All rclone FTP profiles failed. Проверь JINO_FTP_* в Secrets и параметры FTP в панели Джино (хост, порт, FTPS)."
          exit 1
